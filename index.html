<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grosmeister Relocation: переїзд до Чилі, Уругваю та Еквадору</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#fff;--soft:#eef4ff;--card:#fff;--ink:#0b2545;--mute:#51647d;--line:#d9e3f2;--blue:#1456d8;--blue-d:#0d3fa8;--warn-bg:#fff4d6;--warn:#7a5200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{margin-right:auto;font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:34px;height:34px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
nav{display:flex;gap:20px;font-size:15px}
nav a{color:var(--mute);text-decoration:none}nav a:hover,nav a.on{color:var(--blue)}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--blue);color:#fff;font:700 15px Onest,system-ui,sans-serif;padding:11px 20px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn.ghost:hover{background:var(--soft)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin:20px 0 0}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:48px 0 64px}
.head{padding:44px 0 8px}
h1{font-size:clamp(32px,5vw,52px);line-height:1.1;margin:0 0 18px;font-weight:800;letter-spacing:-.02em}
.lead{color:var(--mute);font-size:18px;max-width:50ch;margin:0 0 24px}
.facts{display:flex;gap:32px;flex-wrap:wrap;margin-top:28px}
.facts b{display:block;font-size:26px;color:var(--blue);line-height:1.2}
.facts span{font-size:14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.quiz{background:var(--soft)}
.quiz h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;font:500 16px Onest,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--blue)}
.price{font-size:34px;font-weight:800;color:var(--blue);margin:6px 0}
.res p{margin:0 0 14px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap}
section{padding:52px 0;border-top:1px solid var(--line)}
h2.t{font-size:clamp(26px,3.5vw,34px);margin:0 0 8px;letter-spacing:-.01em}
.sub2{color:var(--mute);margin:0 0 28px;max-width:62ch}
.cc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.cc a{text-decoration:none;color:inherit}
.cc .card:hover{border-color:var(--blue)}
.cc h3{margin:0 0 6px;font-size:22px}.cc .p{color:var(--blue);font-weight:800;font-size:20px;margin:10px 0 0}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pk h3{margin:0 0 4px;font-size:18px}
.pk .p{font-size:28px;font-weight:800;color:var(--blue);margin:0 0 12px}
.pk .p small{font-size:14px;font-weight:500;color:var(--mute)}
ul.ck{list-style:none;margin:0;padding:0;font-size:15px}
ul.ck li{padding:5px 0 5px 24px;position:relative}
ul.ck li::before{content:"✓";position:absolute;left:0;color:var(--blue);font-weight:800}
ul.no li::before{content:"–";color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.steps h3{margin:0 0 6px;font-size:17px}.steps p{margin:0;color:var(--mute);font-size:15px}
form{display:grid;gap:12px;max-width:480px}
label{font-size:14px;color:var(--mute);display:grid;gap:4px}
input,select{font:400 16px Onest,system-ui,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ok{display:none;color:var(--blue);font-weight:700}
.back{display:inline-block;margin-bottom:14px;color:var(--blue);text-decoration:none;font-weight:500}
footer{padding:28px 0 40px;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:28px}nav{display:none}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}

body{overflow-x:hidden}
.logo img{border-radius:9px;display:block}.logo span{color:var(--blue);font-weight:500}
.card{background:linear-gradient(160deg,#1a5fe0,#0c3a9e);color:#fff;border:0;border-radius:18px}
.card .sub,.card p{color:#d3e2ff}
.card .p,.card .price,.card h3{color:#fff}
.pk .p small{color:#d3e2ff}
.card ul.ck li::before{color:#9cc8ff}
.card h2.t::after{background:#9cc8ff}
h2.t::after{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--blue);margin-top:10px}
.card.quiz{--ink:#0b2545;--mute:#51647d;--line:#d9e3f2;background:#fff;color:#0b2545;box-shadow:0 20px 50px rgba(5,20,70,.35)}
.card.quiz p,.card.quiz .sub{color:#51647d}.card.quiz .price{color:#1456d8}.card.quiz h2{color:#0b2545}
.hero,.head{position:relative;isolation:isolate;color:#fff}
.hero::before,.head::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;margin-left:-50vw;z-index:-1;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 1px,transparent 1px 26px),linear-gradient(135deg,#0a2466,#1456d8)}
.hero{padding:56px 0 64px;margin-top:20px}
.head{padding:44px 0 40px;margin-top:20px}
.hero h1,.head h1{color:#fff}
.hero .lead,.head .lead{color:#d6e4ff}
.hero .facts b{color:#fff}.hero .facts span{color:#c9d9f7}
.hero>div:first-child .btn{background:#fff;color:#0a2466}
.hero>div:first-child .btn.ghost{background:transparent;color:#fff;border:1px solid #fff}
.back{color:#cfe0ff}
.flag{width:36px;height:24px;border-radius:4px;vertical-align:-3px;margin-right:10px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.cc .card{transition:transform .2s,box-shadow .2s}.cc .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(20,86,216,.3)}
.steps{counter-reset:s}.steps .card::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;color:#1456d8;font-weight:800;margin-bottom:12px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
footer{background:#0a2466;color:#c9d9f7;border:0}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.hero>*{animation:up .6s both}.hero>*:nth-child(2){animation-delay:.15s}
@media (max-width:820px){.cgrid{grid-template-columns:1fr}.hero{padding-top:36px}}
@media (prefers-reduced-motion:reduce){.hero>*{animation:none}.cc .card{transition:none}}
.lg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lg button{border:0;background:none;padding:6px 11px;font:700 13px Onest,system-ui,sans-serif;color:var(--mute);cursor:pointer}
.lg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.ci{list-style:none;margin:16px 0;padding:0}.ci li{padding:3px 0}.ci a,.soc a{color:#fff}
.soc{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.qb{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.qb .btn{background:#fff;color:#0a2466;padding:9px 14px;font-size:14px}
.head .btn{background:#fff;color:#0a2466}
section h2.t{margin-top:0}
.head{padding-top:64px}
.why{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.why li{position:relative;padding:16px 0 16px 40px;border-bottom:1px solid var(--line);font-size:17px}
.why li::before{content:"✓";position:absolute;left:0;top:16px;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:800;font-size:14px;display:grid;place-items:center}
.tl{list-style:none;margin:0;padding:0;counter-reset:s;max-width:760px}
.tl li{counter-increment:s;position:relative;padding:0 0 30px 66px}
.tl li::before{content:counter(s);position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center}
.tl li::after{content:"";position:absolute;left:21px;top:50px;bottom:6px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl b{display:block;font-size:19px}.tl span{color:var(--mute)}
.pkc{padding:0;background:#fff;color:var(--ink);border:1px solid var(--line);overflow:hidden}
.pkc .ph{background:linear-gradient(160deg,#1a5fe0,#0c3a9e);padding:20px 24px}
.pkc .ph h3{margin:0 0 4px}.pkc .ph .p{margin:0}
.pkc ul{padding:14px 24px 20px}
.pkc ul.ck li::before{color:var(--blue)}
.two .card{background:var(--soft);color:var(--ink)}
.two .card h3{color:var(--ink)}.two .card p{color:var(--mute)}
.two .card ul.ck li::before{color:var(--blue)}
@media (max-width:820px){.why{grid-template-columns:1fr}}
@media (max-width:600px){header .btn{display:none}.logo{font-size:15px}header .wrap{gap:10px}}
</style>
</head>
